[experiment]
name = "dinov3_grid_unfreeze2"

[data]
# Change this path on the machine containing the labeled data set.
dataset_dir = "/home/nfs/data/nvme_datasets/Pictures_CFSB_leaf_damage/RSFB-Phenotyping_training_set/RSFB-Phenotyping_training_set"
scores_file = "RSFB-Phenotyping_training_set_scores.csv"
filename_column = "Filename"
target_column = "mean_score"
image_extension = ".jpg"
validation_fraction = 0.33
split_seed = 42
verify_images = true
grid_crop_size = 1400
# Relative paths are resolved from the directory where the command is run.
grid_cache_dir = "cache/grid_crops_1400"

[augmentation]
# Mild, orientation-safe augmentation. Set enabled=false for a stricter
# architecture-only comparison with the earlier grid-cropped experiment.
enabled = true
horizontal_flip_probability = 0.5
vertical_flip_probability = 0.5
color_jitter_strength = 0.05

[model]
backbone = "facebook/dinov3-vitb16-pretrain-lvd1689m"
# This intentionally preserves the image processor selected in index.ipynb.
processor = "facebook/dinov3-vits16-pretrain-lvd1689m"
unfreeze_last_n_blocks = 2
unfreeze_final_norm = true
head_hidden_dim = 256
dropout = 0.1

[training]
epochs = 30
eval_every = 1
# RTX 3090 starting point: micro-batch 8, effective batch 16.
batch_size = 8
gradient_accumulation_steps = 2
num_workers = 4
head_learning_rate = 0.0003
backbone_learning_rate = 0.00001
head_weight_decay = 0.0001
backbone_weight_decay = 0.01
warmup_fraction = 0.1
minimum_learning_rate_ratio = 0.05
gradient_clip_norm = 1.0
early_stopping_patience = 6
early_stopping_min_delta = 0.0001
seed = 42

[runtime]
device = "auto"
deterministic = true
pin_memory = true
mixed_precision = "fp16"
allow_tf32 = true
# Detailed data/compute timing synchronizes CUDA and is deliberately limited.
profile_first_n_epochs = 1

[output]
run_dir = "outputs/dinov3_grid_unfreeze2"
best_checkpoint_name = "best.pt"
last_checkpoint_name = "last.pt"
save_plots = true
example_images = 12
example_columns = 4
grid_failure_log = "grid_failures.jsonl"
