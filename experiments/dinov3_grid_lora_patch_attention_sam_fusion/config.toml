[experiment]
name = "dinov3_grid_lora_patch_attention_sam_fusion_warmstart_aux_clean_inset075"

[data]
# Change this path on the machine containing the labeled data set.
dataset_dir = "/home/nfs/data/nvme_datasets/Pictures_CFSB_leaf_damage/RSFB-Phenotyping_training_set/RSFB-Phenotyping_training_set"
scores_file = "RSFB-Phenotyping_training_set_scores.csv"
filename_column = "Filename"
target_column = "mean_score"
image_extension = ".jpg"
validation_fraction = 0.33
split_seed = 42
verify_images = true
grid_crop_size = 1400
grid_cache_dir = "cache/grid_crops_1400_inset075"
grid_inner_margin_fraction = 0.075
normalize_targets = true

[augmentation]
enabled = true
horizontal_flip_probability = 0.5
vertical_flip_probability = 0.5
color_jitter_strength = 0.05

[segmentation]
model_name = "facebook/sam3"
prompts = ["green leaf"]
score_threshold = 0.25
mask_threshold = 0.5
mask_cache_dir = "cache/sam3_masks_grid1400_inset075"
device = "auto"
background_value = 255
minimum_foreground_fraction = 0.0001
maximum_foreground_fraction = 0.6

[model]
backbone = "facebook/dinov3-vitb16-pretrain-lvd1689m"
processor = "facebook/dinov3-vits16-pretrain-lvd1689m"
lora_rank = 8
lora_alpha = 16
lora_dropout = 0.05
lora_target_modules = ["q_proj", "v_proj"]
train_final_norm = true
attention_hidden_dim = 128
attention_dropout = 0.1
attention_temperature = 1.0
mask_input_size = 56
mask_embedding_dim = 128
fusion_hidden_dim = 256
fusion_dropout = 0.2
head_hidden_dim = 256
dropout = 0.1

[training]
epochs = 30
eval_every = 1
batch_size = 4
gradient_accumulation_steps = 4
num_workers = 4
head_learning_rate = 0.0003
adapter_learning_rate = 0.0001
head_weight_decay = 0.0001
adapter_weight_decay = 0.0
warmup_fraction = 0.1
minimum_learning_rate_ratio = 0.05
gradient_clip_norm = 1.0
early_stopping_patience = 6
early_stopping_min_delta = 0.0001
warm_start_frozen_epochs = 5
base_auxiliary_loss_weight = 0.25
delta_penalty_weight = 0.01
seed = 42

[runtime]
device = "auto"
deterministic = true
pin_memory = true
mixed_precision = "fp16"
allow_tf32 = true
profile_first_n_epochs = 1

[output]
run_dir = "outputs/dinov3_grid_lora_patch_attention_sam_fusion_warmstart_aux_clean_inset075"
best_checkpoint_name = "best.pt"
last_checkpoint_name = "last.pt"
save_plots = true
example_images = 12
example_columns = 4
attention_inspection_images = 6
attention_top_fraction = 0.1
attention_ratio_min = 0.5
attention_ratio_max = 2.0
attention_arrays_name = "sam_fusion_attention.npz"
grid_failure_log = "grid_failures.jsonl"
sam_failure_log = "sam_failures.jsonl"
sam_inspection_images = 24
