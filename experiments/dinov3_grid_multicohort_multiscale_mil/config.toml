[experiment]
name = "dinov3_grid_multicohort_multiscale_mil"

[data]
manifest_dir = "outputs/dataset_manifests"
pretrain_manifest = "pretrain.csv"
finetune_manifest = "finetune.csv"
validation_manifest = "validation.csv"
test_manifest = "test.csv"
absolute_path_column = "absolute_path"
filename_column = "relative_path"
target_column = "target"
sample_weight_column = "sample_weight"
cohort_column = "cohort_id"
supervision_tier_column = "supervision_tier"
verify_images = true
grid_crop_size = 1400
grid_cache_dir = "cache/grid_crops_multicohort_1400_inset075"
grid_inner_margin_fraction = 0.075
normalize_targets = true

[features]
backbone = "facebook/dinov3-vitb16-pretrain-lvd1689m"
processor = "facebook/dinov3-vits16-pretrain-lvd1689m"
representation = "cls_mean"
storage_dtype = "float16"
extraction_batch_size = 16
overwrite = false

[coarse]
rows = 3
columns = 3
overlap_fraction = 0.25
include_global_view = true
cache_dir = "cache/dinov3_multicohort_features_3x3"

[fine]
rows = 4
columns = 4
overlap_fraction = 0.25
include_global_view = true
cache_dir = "cache/dinov3_multicohort_features_4x4"

[model]
projection_dim = 128
attention_hidden_dim = 64
attention_dropout = 0.1
attention_temperature = 1.0
head_hidden_dim = 128
dropout = 0.35

[training]
seed = 42

[pretraining]
epochs = 40
learning_rate = 0.001
batch_size = 32
num_workers = 4
weight_decay = 0.001
warmup_fraction = 0.1
minimum_learning_rate_ratio = 0.05
gradient_clip_norm = 1.0
early_stopping_patience = 10
early_stopping_min_delta = 0.0001

[finetuning]
epochs = 80
learning_rate = 0.0003
batch_size = 32
num_workers = 4
weight_decay = 0.001
warmup_fraction = 0.1
minimum_learning_rate_ratio = 0.05
gradient_clip_norm = 1.0
early_stopping_patience = 12
early_stopping_min_delta = 0.0001

[runtime]
device = "auto"
deterministic = true
pin_memory = true
mixed_precision = "fp16"
allow_tf32 = true

[output]
run_dir = "outputs/dinov3_grid_multicohort_multiscale_mil"
pretrain_checkpoint_name = "pretrain_best_mse.pt"
best_checkpoint_name = "best_mse.pt"
best_mae_checkpoint_name = "best_mae.pt"
last_checkpoint_name = "last.pt"
save_plots = true
example_images = 12
example_columns = 4
attention_inspection_images = 6
attention_arrays_name = "multiscale_tile_attention.npz"
grid_failure_log = "grid_failures.jsonl"
feature_failure_log = "feature_failures.jsonl"
